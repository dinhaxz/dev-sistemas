
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar Jogo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8eef7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #243b64;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #1e40af;
        }

        #erro {
            color: red;
        }

        #sucesso {
            color: green;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Avaliar Jogo</h1>

        <p id="nomePlataforma"></p>

        <form id="formulario">

            <label for="comentario">Comentário:</label>

            <input
                type="text"
                id="comentario"
                placeholder="Digite seu comentário"
            >

            <label for="nota">Nota (1 a 5):</label>

            <input
                type="number"
                id="nota"
                placeholder="Digite uma nota"
            >

            <button type="submit">Enviar Avaliação</button>

        </form>

        <p id="erro"></p>
        <p id="sucesso"></p>

        <a href="cadastrar_plataforma.html">Voltar ao cadastro</a>

    </div>

    <script>

        // Recebendo a plataforma cadastrada
        const plataforma = localStorage.getItem("plataforma");

        document.getElementById("nomePlataforma").textContent =
            "Plataforma: " + (plataforma || "Não cadastrada");

        const formulario = document.getElementById("formulario");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const comentario = document.getElementById("comentario").value.trim();
            const nota = document.getElementById("nota").value;

            const erro = document.getElementById("erro");
            const sucesso = document.getElementById("sucesso");

            // Limpando mensagens anteriores
            erro.textContent = "";
            sucesso.textContent = "";

            // Validando comentário
            if (comentario === "") {
                erro.textContent = "O comentário não pode estar vazio!";
                return;
            }

            // Validando nota
            if (nota === "" || Number(nota) < 1 || Number(nota) > 5 || !Number.isInteger(Number(nota))) {
                erro.textContent = "A nota deve ser um número inteiro entre 1 e 5!";
                return;
            }

            // Criando objeto da avaliação
            const avaliacao = {
                plataforma: plataforma,
                comentario: comentario,
                nota: Number(nota)
            };

            console.log(avaliacao);

            sucesso.textContent = "Avaliação enviada com sucesso!";

            formulario.reset();

        });

    </script>

</body>

</html>
